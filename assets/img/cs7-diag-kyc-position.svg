<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KYC's position in the flow, before and after: previously right after sign-up, before the deposit; now after deposit and Autosave setup are confirmed.">
  <defs>
    <marker id="cs7kyc-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1b21"/>
    </marker>
    <marker id="cs7kyc-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a7d92"/>
    </marker>
  </defs>

  <g font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">

    <!-- row labels -->
    <text x="20" y="22" font-size="11" font-weight="700" letter-spacing="1" fill="#6c6b64">OLD FLOW</text>
    <text x="20" y="172" font-size="11" font-weight="700" letter-spacing="1" fill="#6c6b64">NEW FLOW</text>

    <!-- connecting arrows between boxes, row 1 -->
    <g stroke="#1b1b21" stroke-width="1.5">
      <line x1="150" y1="65" x2="178" y2="65" marker-end="url(#cs7kyc-arrow)"/>
      <line x1="310" y1="65" x2="338" y2="65" marker-end="url(#cs7kyc-arrow)"/>
      <line x1="470" y1="65" x2="498" y2="65" marker-end="url(#cs7kyc-arrow)"/>
      <line x1="630" y1="65" x2="658" y2="65" marker-end="url(#cs7kyc-arrow)"/>
    </g>
    <!-- connecting arrows between boxes, row 2 -->
    <g stroke="#1b1b21" stroke-width="1.5">
      <line x1="150" y1="215" x2="178" y2="215" marker-end="url(#cs7kyc-arrow)"/>
      <line x1="310" y1="215" x2="338" y2="215" marker-end="url(#cs7kyc-arrow)"/>
      <line x1="470" y1="215" x2="498" y2="215" marker-end="url(#cs7kyc-arrow)"/>
      <line x1="630" y1="215" x2="658" y2="215" marker-end="url(#cs7kyc-arrow)"/>
    </g>

    <!-- moved connector: old KYC -> new KYC -->
    <path d="M245,90 C245,145 565,145 565,188" fill="none" stroke="#0a7d92" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cs7kyc-arrow-accent)"/>

    <!-- row 1: old flow -->
    <g font-size="13" font-weight="600" text-anchor="middle">
      <rect x="20" y="40" width="130" height="50" rx="10" fill="#ffffff" stroke="#d3ccbb" stroke-width="1.5"/>
      <text x="85" y="70" fill="#1b1b21">Sign up</text>

      <rect x="180" y="40" width="130" height="50" rx="10" fill="#ffffff" stroke="#0a7d92" stroke-width="1.5"/>
      <text x="245" y="70" fill="#0a7d92">KYC</text>

      <rect x="340" y="40" width="130" height="50" rx="10" fill="#ffffff" stroke="#d3ccbb" stroke-width="1.5"/>
      <text x="405" y="70" fill="#1b1b21">Deposit</text>

      <rect x="500" y="40" width="130" height="50" rx="10" fill="#ffffff" stroke="#d3ccbb" stroke-width="1.5"/>
      <text x="565" y="70" fill="#1b1b21">Autosave</text>

      <rect x="660" y="40" width="130" height="50" rx="10" fill="#f5f2ea" stroke="#d3ccbb" stroke-width="1.5"/>
      <text x="725" y="70" fill="#1b1b21">Done</text>
    </g>
    <text x="245" y="108" text-anchor="middle" font-size="12" fill="#0a7d92">pre-deposit</text>

    <!-- row 2: new flow -->
    <g font-size="13" font-weight="600" text-anchor="middle">
      <rect x="20" y="190" width="130" height="50" rx="10" fill="#ffffff" stroke="#d3ccbb" stroke-width="1.5"/>
      <text x="85" y="220" fill="#1b1b21">Sign up</text>

      <rect x="180" y="190" width="130" height="50" rx="10" fill="#ffffff" stroke="#d3ccbb" stroke-width="1.5"/>
      <text x="245" y="220" fill="#1b1b21">Deposit</text>

      <rect x="340" y="190" width="130" height="50" rx="10" fill="#ffffff" stroke="#d3ccbb" stroke-width="1.5"/>
      <text x="405" y="220" fill="#1b1b21">Autosave</text>

      <rect x="500" y="190" width="130" height="50" rx="10" fill="#ffffff" stroke="#0a7d92" stroke-width="1.5"/>
      <text x="565" y="220" fill="#0a7d92">KYC</text>

      <rect x="660" y="190" width="130" height="50" rx="10" fill="#f5f2ea" stroke="#d3ccbb" stroke-width="1.5"/>
      <text x="725" y="220" fill="#1b1b21">Done</text>
    </g>
    <text x="565" y="258" text-anchor="middle" font-size="12" fill="#0a7d92">post-intent</text>
  </g>
</svg>
